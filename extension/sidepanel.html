<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Antigravity</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- Shared New 4-Color Rounded Gemini Spark Definition (Blue, Red, Yellow, Green) -->
    <svg width="0" height="0" style="position: absolute; pointer-events: none" aria-hidden="true">
      <defs>
        <clipPath id="gem-spark-clip">
          <path
            d="M14.9 3.2C15.15 1.85 16.85 1.85 17.1 3.2C18.25 9.41 22.59 13.75 28.8 14.9C30.15 15.15 30.15 16.85 28.8 17.1C22.59 18.25 18.25 22.59 17.1 28.8C16.85 30.15 15.15 30.15 14.9 28.8C13.75 22.59 9.41 18.25 3.2 17.1C1.85 16.85 1.85 15.15 3.2 14.9C9.41 13.75 13.75 9.41 14.9 3.2Z"
          />
        </clipPath>
        <radialGradient id="gem-c-red" cx="16" cy="2" r="12.6" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#EA4335" />
          <stop offset="52%" stop-color="#EA4335" stop-opacity="0.92" />
          <stop offset="100%" stop-color="#EA4335" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="gem-c-yellow" cx="2" cy="16" r="12.8" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#FBBC04" />
          <stop offset="55%" stop-color="#FBBC04" stop-opacity="0.96" />
          <stop offset="100%" stop-color="#FBBC04" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="gem-c-green" cx="16" cy="30" r="12.6" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#34A853" />
          <stop offset="52%" stop-color="#34A853" stop-opacity="0.94" />
          <stop offset="100%" stop-color="#34A853" stop-opacity="0" />
        </radialGradient>
        <symbol id="gemini-spark-4c" viewBox="0 0 32 32">
          <g clip-path="url(#gem-spark-clip)">
            <rect width="32" height="32" fill="#4285F4" />
            <rect width="32" height="32" fill="url(#gem-c-red)" />
            <rect width="32" height="32" fill="url(#gem-c-green)" />
            <rect width="32" height="32" fill="url(#gem-c-yellow)" />
          </g>
        </symbol>
      </defs>
    </svg>

    <div class="app-shell">
      <div class="ambient-aura" aria-hidden="true"></div>

      <!-- New Gemini Centered Minimal Header -->
      <header class="topbar">
        <div class="topbar-side topbar-left">
          <button
            type="button"
            class="circle-icon-btn"
            id="history-btn"
            title="Recent chats &amp; scheduled tasks"
            aria-label="Menu"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.85">
              <path d="M4 8.5h16M4 15.5h11" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <div class="topbar-center">
          <span class="brand-wordmark" id="header-title">Antigravity</span>
          <span class="offline-dot hidden" id="bridge-dot" title="Native bridge offline"></span>
        </div>

        <div class="topbar-side topbar-right">
          <button type="button" class="circle-icon-btn" id="new-chat-btn" title="New chat" aria-label="New chat">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8">
              <path
                d="M11 4H6.8A2.8 2.8 0 0 0 4 6.8v10.4A2.8 2.8 0 0 0 6.8 20h10.4a2.8 2.8 0 0 0 2.8-2.8V13"
                stroke-linecap="round"
              />
              <path
                d="M17.6 3.9a1.8 1.8 0 0 1 2.5 2.5L12.3 14.2l-3.3.8.8-3.3 7.8-7.8Z"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <!-- Live Browser Control Pill (Shown ONLY when debugger is actively controlling tabs) -->
      <section class="live-control-pill hidden" id="desktop-activity-bar">
        <div class="live-control-info">
          <span class="live-pulse"></span>
          <span id="desktop-activity-text">Controlling browser tab</span>
        </div>
        <button type="button" class="live-stop-btn" id="detach-all-btn">Take over</button>
      </section>

      <!-- Subtle Onboarding Card (Only if CLI/bridge missing) -->
      <section class="notice-card hidden" id="setup-banner">
        <div class="notice-card-header">
          <span class="notice-title" id="setup-banner-title">Finish connecting Antigravity</span>
          <button type="button" class="tonal-pill-btn hidden" id="banner-reconnect-btn">Reconnect</button>
        </div>
        <p class="notice-desc" id="setup-banner-desc"></p>
      </section>

      <!-- Unified Navigation Drawer (Recent Chats & Scheduled Tasks) -->
      <aside class="sheet-view hidden" id="history-drawer" aria-label="Activity menu">
        <div class="sheet-header">
          <div class="tonal-segmented drawer-tabs" id="drawer-tabs-group" role="tablist">
            <button type="button" class="tonal-seg-btn active" id="tab-btn-chats" data-drawer-tab="chats">
              Recent chats
            </button>
            <button type="button" class="tonal-seg-btn" id="tab-btn-schedules" data-drawer-tab="schedules">
              Scheduled
            </button>
          </div>
          <button type="button" class="circle-icon-btn" id="close-history-btn" aria-label="Close menu">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.85">
              <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <!-- Tab Panel: Recent Chats -->
        <div class="drawer-panel" id="drawer-panel-chats">
          <div class="drawer-subbar">
            <p class="sheet-subtitle">Synced with your Antigravity desktop app</p>
            <button type="button" class="tonal-pill-btn" id="open-desktop-btn">Open app ↗</button>
          </div>
          <div class="sheet-list" id="history-list"></div>
        </div>

        <!-- Tab Panel: Scheduled Tasks -->
        <div class="drawer-panel hidden" id="drawer-panel-schedules">
          <p class="sheet-subtitle">Run recurring page checks or browser workflows on a timer.</p>
          <form class="tonal-form-card" id="schedule-form">
            <input type="text" id="sched-name" placeholder="Task title (e.g. Morning briefing)" required />
            <input type="url" id="sched-url" placeholder="Optional page URL (https://…)" />
            <textarea id="sched-prompt" rows="2" placeholder="What should Antigravity do?" required></textarea>

            <div class="form-chip-row">
              <div class="tonal-segmented compact" id="sched-interval-group" role="group" aria-label="Frequency">
                <button type="button" class="tonal-seg-btn" data-interval="15">15m</button>
                <button type="button" class="tonal-seg-btn active" data-interval="60">1h</button>
                <button type="button" class="tonal-seg-btn" data-interval="360">6h</button>
                <button type="button" class="tonal-seg-btn" data-interval="1440">Daily</button>
              </div>

              <div class="tonal-segmented compact" id="sched-mode-group" role="group" aria-label="Mode">
                <button type="button" class="tonal-seg-btn active" data-sched-mode="chat">Read</button>
                <button type="button" class="tonal-seg-btn" data-sched-mode="agent">Agent</button>
              </div>

              <button type="submit" class="filled-pill-btn">Create</button>
            </div>
          </form>

          <div class="sheet-list" id="schedules-list"></div>
        </div>
      </aside>

      <!-- Main Conversation Canvas -->
      <main class="chat-viewport" id="chat-viewport">
        <!-- New Gemini Homepage Greeting ("Hi there" + Solid White "Where should we start?") -->
        <div class="welcome-state" id="welcome-state">
          <div class="greeting-block">
            <div class="greeting-eyebrow">
              <svg class="greeting-spark-icon" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
                <use href="#gemini-spark-4c" />
              </svg>
              <span class="greeting-hi" id="greeting-headline">Hi there</span>
            </div>
            <h1 class="greeting-question">Where should we start?</h1>
          </div>

          <div class="suggestion-pills" id="quick-grid">
            <button type="button" class="suggestion-pill" data-shortcut="summarize">
              <span>Summarize this page</span>
            </button>
            <button type="button" class="suggestion-pill" data-shortcut="extract-table">
              <span>Extract key data &amp; tables</span>
            </button>
            <button type="button" class="suggestion-pill" data-shortcut="audit-page">
              <span>Inspect console &amp; page issues</span>
            </button>
            <button type="button" class="suggestion-pill" data-shortcut="organize-tabs">
              <span>Organize my open tabs</span>
            </button>
          </div>
        </div>

        <!-- Messages Stream -->
        <div class="messages-list" id="messages-list"></div>
      </main>

      <!-- New Gemini Edge-to-Edge Rounded Bottom Prompt Sheet -->
      <footer class="composer-dock">
        <!-- Upward Popover: + Add & Tools Menu (Bottom-Left) -->
        <div class="floating-menu add-menu hidden" id="add-menu-popover" role="menu">
          <button type="button" class="menu-action-item" id="menu-share-tabs-btn">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3.5" y="5" width="17" height="14" rx="2.8" />
              <path d="M3.5 9.2h17" stroke-linecap="round" />
            </svg>
            <div class="menu-action-copy">
              <span class="menu-action-title">Share open tabs</span>
              <span class="menu-action-sub">Include up to 10 tabs with @</span>
            </div>
          </button>

          <button type="button" class="menu-action-item" id="screenshot-btn">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3.5" y="5" width="17" height="14" rx="2.8" />
              <circle cx="9" cy="10.2" r="1.6" />
              <path d="M20.5 15.2l-4.2-4.2L9.5 18" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="menu-action-copy">
              <span class="menu-action-title">Capture current view</span>
              <span class="menu-action-sub">Attach visible page screenshot</span>
            </div>
          </button>

          <button type="button" class="menu-action-item" id="menu-shortcuts-btn">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 7h10M18 7h2M14 5v4M4 17h4M12 17h8M8 15v4" stroke-linecap="round" />
            </svg>
            <div class="menu-action-copy">
              <span class="menu-action-title">Shortcuts &amp; skills</span>
              <span class="menu-action-sub">Run or save / workflows</span>
            </div>
          </button>

          <button type="button" class="menu-action-item" id="schedules-btn">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="8.2" />
              <path d="M12 7.6v4.6l3 1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="menu-action-copy">
              <span class="menu-action-title">Scheduled tasks</span>
              <span class="menu-action-sub">Automate recurring checks</span>
            </div>
          </button>
        </div>

        <!-- Upward Popover: Bottom-Right Model & Thinking/Approval Picker -->
        <div class="floating-menu model-menu hidden" id="model-popover" role="menu">
          <div class="menu-section-label">Choose your model</div>
          <div class="model-options-list" id="model-options-list"></div>

          <div class="menu-divider"></div>
          <div class="menu-section-label">Action approval</div>
          <div class="tonal-segmented" id="permission-segmented" role="radiogroup" aria-label="Action approval">
            <button type="button" class="tonal-seg-btn active" data-perm="auto">Auto</button>
            <button type="button" class="tonal-seg-btn" data-perm="default">Ask</button>
            <button type="button" class="tonal-seg-btn" data-perm="plan">Plan</button>
          </div>

          <div class="menu-bridge-row hidden" id="bridge-reconnect-row">
            <span class="bridge-status-caption" id="bridge-label">Offline</span>
            <button type="button" class="tonal-pill-btn" id="bridge-status-btn">Reconnect</button>
          </div>
        </div>

        <!-- Upward Popover: / Shortcuts & Skills -->
        <div class="floating-menu picker-popover hidden" id="slash-popover">
          <div class="picker-header">
            <span class="picker-title">Shortcuts &amp; skills</span>
            <button type="button" class="text-pill-btn" id="open-save-shortcut-btn">+ New shortcut</button>
          </div>
          <div class="tonal-subform hidden" id="save-shortcut-box">
            <input type="text" id="custom-sc-cmd" placeholder="Shortcut name (e.g. brief)" />
            <input type="text" id="custom-sc-title" placeholder="Short description" />
            <textarea id="custom-sc-prompt" rows="2" placeholder="Prompt instructions…"></textarea>
            <div class="form-chip-row">
              <div class="tonal-segmented compact" id="custom-sc-mode-group">
                <button type="button" class="tonal-seg-btn active" data-sc-mode="chat">Read</button>
                <button type="button" class="tonal-seg-btn" data-sc-mode="agent">Agent</button>
              </div>
              <button type="button" class="filled-pill-btn" id="save-custom-sc-btn">Save</button>
            </div>
          </div>
          <div class="picker-list" id="slash-list"></div>
        </div>

        <!-- Upward Popover: @ Open Tabs Picker -->
        <div class="floating-menu picker-popover hidden" id="tabs-popover">
          <div class="picker-header">
            <span class="picker-title">Share open tabs</span>
            <button type="button" class="text-pill-btn" id="group-mentioned-btn">Group tabs</button>
          </div>
          <div class="picker-list" id="tabs-picker-list"></div>
        </div>

        <!-- The Signature New Gemini Rounded-Top Prompt Sheet -->
        <div class="composer-sheet" id="composer-card">
          <!-- Shared Tab & Attachment Context Shelf -->
          <div class="context-shelf" id="context-shelf">
            <div class="shared-page-chip" id="active-tab-chip">
              <img class="tab-favicon hidden" id="active-tab-favicon" alt="" width="14" height="14" />
              <svg
                class="tab-globe-icon"
                id="active-tab-globe"
                viewBox="0 0 24 24"
                width="14"
                height="14"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <circle cx="12" cy="12" r="8.5" />
                <path
                  d="M3.8 12h16.4M12 3.5c2.4 2.4 3.7 5.4 3.7 8.5s-1.3 6.1-3.7 8.5c-2.4-2.4-3.7-5.4-3.7-8.5s1.3-6.1 3.7-8.5Z"
                />
              </svg>
              <span class="shared-page-title" id="active-tab-title">Current page</span>
              <button
                type="button"
                class="chip-dismiss-btn"
                id="unshare-active-tab-btn"
                title="Stop sharing current page"
                aria-label="Stop sharing current page"
              >
                <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke-linecap="round" />
                </svg>
              </button>
            </div>

            <button type="button" class="reshare-page-chip hidden" id="reshare-active-tab-btn">
              <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M8 3.2v9.6M3.2 8h9.6" stroke-linecap="round" />
              </svg>
              <span>Share current tab</span>
            </button>

            <div class="extra-chips-wrap" id="attachment-chips"></div>
          </div>

          <!-- Prompt Input -->
          <textarea
            id="prompt-input"
            rows="1"
            placeholder="Ask Antigravity"
            aria-label="Ask Antigravity"
          ></textarea>

          <!-- New Gemini Bottom Controls Row: [+][Agent] ... [Model ▾][Send] -->
          <div class="composer-toolbar">
            <div class="toolbar-left">
              <button
                type="button"
                class="composer-circle-btn"
                id="add-menu-btn"
                title="Add tabs, screenshot, or shortcuts"
                aria-label="Add context or tools"
              >
                <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9">
                  <path d="M12 5v14M5 12h14" stroke-linecap="round" />
                </svg>
              </button>

              <button
                type="button"
                class="tools-toggle-pill"
                id="agent-mode-toggle"
                aria-pressed="false"
                title="Toggle Auto Browse / Agent Mode"
              >
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.85">
                  <path d="M4 8h9M17 8h3M13 5.5v5M4 16h3M11 16h9M7 13.5v5" stroke-linecap="round" />
                </svg>
                <span>Agent</span>
              </button>
            </div>

            <div class="toolbar-right">
              <button
                type="button"
                class="composer-model-pill"
                id="model-menu-btn"
                aria-haspopup="true"
                aria-expanded="false"
                title="Switch model &amp; approval mode"
              >
                <span class="model-current-label" id="model-current-label">Pro</span>
                <svg
                  class="chevron-xs"
                  viewBox="0 0 20 20"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.9"
                >
                  <path d="M5.5 7.75L10 12.25l4.5-4.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>

              <button type="button" class="send-fab" id="send-btn" title="Send" aria-label="Send" disabled>
                <svg
                  id="send-icon"
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                >
                  <path d="M12 19V5M6 11l6-6 6 6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <svg id="stop-icon" class="hidden" viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
                  <rect x="6" y="6" width="12" height="12" rx="2.6" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
