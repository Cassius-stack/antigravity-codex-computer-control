<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Antigravity in Chrome</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="card">
      <div class="ambient-glow" aria-hidden="true"></div>

      <header class="header">
        <img class="logo" src="icons/icon48.png" width="34" height="34" alt="Antigravity" />
        <div class="title-wrap">
          <h1>Antigravity in Chrome</h1>
          <p class="subtitle" id="browser-label">Detecting browser…</p>
        </div>
        <span class="status-pill disconnected" id="bridge-pill">
          <span class="status-dot"></span>
          <span id="bridge-status-text">Offline</span>
        </span>
      </header>

      <section class="site-access-box" id="site-access-box">
        <div class="site-access-top">
          <span class="site-access-label">Site access</span>
          <span class="site-host" id="popup-host-label">Current tab</span>
        </div>
        <div class="seg-row" id="popup-site-policy">
          <button type="button" class="seg-opt active" data-policy="allow">Allow</button>
          <button type="button" class="seg-opt" data-policy="ask">Ask</button>
          <button type="button" class="seg-opt" data-policy="block">Block</button>
        </div>
      </section>

      <section class="metrics">
        <div class="metric-box">
          <span class="metric-label">Tab Groups</span>
          <span class="metric-value" id="group-count">0</span>
        </div>
        <div class="metric-box">
          <span class="metric-label">Controlled Tabs</span>
          <span class="metric-value" id="attached-count">0</span>
        </div>
      </section>

      <section class="group-summary" id="group-summary">
        Ready. Open the Side Panel to chat with pages or run Agent browser workflows.
      </section>

      <footer class="actions">
        <button type="button" class="btn btn-secondary" id="reconnect-btn">Reconnect</button>
        <button type="button" class="btn btn-secondary" id="finish-btn">Take control</button>
        <button type="button" class="btn btn-primary" id="open-sidepanel-btn">Side Panel</button>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
